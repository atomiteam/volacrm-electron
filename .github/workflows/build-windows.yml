name: Build Windows bundle
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-launcher-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test script execution
        run: npm test
      - name: Build installer and portable app
        run: npm run build:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload Windows bundle
        id: bundle
        uses: actions/upload-artifact@v4
        with:
          name: volacrm-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Show download link
        shell: pwsh
        run: |
          "## VolaCRM Windows bundle" >> $env:GITHUB_STEP_SUMMARY
          "[Download installer and portable app](${{ steps.bundle.outputs.artifact-url }})" >> $env:GITHUB_STEP_SUMMARY
          "Unsigned trial build. Artifacts retained for 30 days." >> $env:GITHUB_STEP_SUMMARY
